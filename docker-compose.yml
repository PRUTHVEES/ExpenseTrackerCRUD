services:
  expense-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: expense-tracker
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
