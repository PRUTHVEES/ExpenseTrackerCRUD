
global:
  scrape_interval: 15s

scrape_configs:
  # Windows host metrics
  - job_name: windows
    static_configs:
      - targets: ["host.docker.internal:9182"]

  # Docker container metrics
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Application availability via Blackbox Exporter
  - job_name: app-availability
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      # Update this to your application's actual health URL.
      - targets: ["http://host.docker.internal:5000/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
