[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Pure unit tests for financial math, filtering, sorting, validation, and data logic
    dom: Static DOM contract, element ID mapping, and accessibility tests for index.html
    e2e: End-to-end browser tests running with Selenium headless Chrome
